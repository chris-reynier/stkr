# GoReleaser v2 configuration. See docs/dev/release.md.
version: 2

project_name: stkr

before:
  hooks:
    # Windows icon and version resources (generated, never committed).
    - go run ./tools/genicon packaging/windows/stkr.ico
    - go tool go-winres simply --arch amd64,arm64 --out cmd/stkr/rsrc --manifest none --icon packaging/windows/stkr.ico --file-version "{{ .Major }}.{{ .Minor }}.{{ .Patch }}.0" --product-version "{{ .Major }}.{{ .Minor }}.{{ .Patch }}.0" --file-description "STKR command line" --product-name STKR --original-filename stkr.exe --copyright "MIT License"
    - go tool go-winres simply --arch amd64,arm64 --out cmd/stkrw/rsrc --manifest none --icon packaging/windows/stkr.ico --file-version "{{ .Major }}.{{ .Minor }}.{{ .Patch }}.0" --product-version "{{ .Major }}.{{ .Minor }}.{{ .Patch }}.0" --file-description "STKR desktop app" --product-name STKR --original-filename stkrw.exe --copyright "MIT License"

builds:
  - id: stkr
    main: ./cmd/stkr
    binary: stkr
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X github.com/chris-reynier/stkr/internal/buildinfo.Version={{.Version}} -X github.com/chris-reynier/stkr/internal/buildinfo.Commit={{.Commit}} -X github.com/chris-reynier/stkr/internal/buildinfo.Date={{.Date}}
    goos: [windows, linux, darwin]
    goarch: [amd64, arm64]
    mod_timestamp: "{{ .CommitTimestamp }}"

  # The Windows desktop app (no console window). Windows only.
  - id: stkrw
    main: ./cmd/stkrw
    binary: stkrw
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -H windowsgui -X github.com/chris-reynier/stkr/internal/buildinfo.Version={{.Version}} -X github.com/chris-reynier/stkr/internal/buildinfo.Commit={{.Commit}} -X github.com/chris-reynier/stkr/internal/buildinfo.Date={{.Date}}
    goos: [windows]
    goarch: [amd64, arm64]
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: stkr
    # stkrw is Windows only, so Linux and macOS archives hold stkr alone.
    ids: [stkr, stkrw]
    allow_different_binary_count: true
    name_template: "stkr_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README.md
      - LICENSE
      - docs/user/**/*

checksum:
  name_template: checksums.txt
  algorithm: sha256

changelog:
  sort: asc
  use: git
  groups:
    - title: Features
      regexp: '^feat(\(.+\))?!?:'
      order: 0
    - title: Fixes
      regexp: '^fix(\(.+\))?!?:'
      order: 1
    - title: Documentation
      regexp: '^docs(\(.+\))?!?:'
      order: 2
    - title: Other
      order: 999
  filters:
    exclude:
      - '^test(\(.+\))?:'
      - '^ci(\(.+\))?:'
      - '^chore(\(.+\))?:'

release:
  prerelease: auto
  # Draft until release.yml has added the setup.exe files and their checksums.
  draft: true
