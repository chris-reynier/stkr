{{define "layout"}}<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="htmx-config" content='{"includeIndicatorStyles":false,"allowEval":false,"allowScriptTags":false}'>
<title>{{.Title}} - STKR</title>
<link rel="stylesheet" href="/static/app.css">
<script src="/static/htmx.min.js" defer></script>
</head>
<body hx-boost="true">
<header class="top">
  <a class="brand" href="/ui/today">STKR</a>
  <nav>{{range .Nav}}<a href="{{.Path}}"{{if .Active}} class="active" aria-current="page"{{end}}>{{.Title}}</a>{{end}}</nav>
</header>
<div id="update-banner" class="banner" {{if not .Banner}}hidden{{end}}>{{.Banner}}</div>
<main>
{{with .Flash}}<p class="flash {{if .Error}}error{{else}}ok{{end}}" role="status">{{.Text}}</p>{{end}}
{{template "content" .}}
</main>
</body>
</html>
{{end}}
