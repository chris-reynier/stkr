name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.15.0
      - name: Test (ubuntu, race)
        if: matrix.os == 'ubuntu-latest'
        env:
          CGO_ENABLED: "1"
        run: go test -race ./...
      - name: Test (windows)
        if: matrix.os == 'windows-latest'
        run: go test ./...
      - name: Cross-build darwin
        run: |
          GOOS=darwin GOARCH=arm64 go build ./...
          GOOS=darwin GOARCH=amd64 go build ./...
        shell: bash
      - name: Cross-build linux and windows
        run: |
          GOOS=linux go build ./...
          GOOS=windows go build ./...
        shell: bash
      - name: CLI docs are up to date
        run: |
          go run ./tools/gendocs
          git diff --exit-code docs/user/cli
        shell: bash
